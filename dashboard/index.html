<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shudhi — Cache Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0b0f;
      --bg-subtle: #0f1117;
      --surface: #151821;
      --surface-hover: #1c2030;
      --surface-active: #1e2238;
      --border: #1e2235;
      --border-light: #282d42;
      --text: #e4e7f1;
      --text-secondary: #b0b4c8;
      --muted: #6b7194;
      --accent: #7c8cf5;
      --accent-hover: #939ff8;
      --accent-glow: rgba(124,140,245,0.12);
      --accent-dim: rgba(124,140,245,0.08);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.1);
      --red: #f47272;
      --red-dim: rgba(244,114,114,0.1);
      --yellow: #fbbf24;
      --radius: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* Header */
    header {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .logo h1 span {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
      font-size: 12px;
    }

    .config-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .config-bar label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .config-bar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      width: 260px;
      outline: none;
      transition: border-color 0.15s;
    }
    .config-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .config-bar button {
      background: linear-gradient(135deg, var(--accent), #6a7bf0);
      color: #fff;
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s;
    }
    .config-bar button:hover { opacity: 0.9; }
    .config-bar button:active { transform: scale(0.97); }

    /* Status dot */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      margin-left: 4px;
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 230px 280px 1fr;
      height: calc(100vh - 56px);
    }

    /* Panels */
    .panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--bg-subtle);
    }
    .panel:last-child { border-right: none; background: var(--bg); }
    .panel-header {
      padding: 14px 16px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-subtle);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header .count {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
    }

    /* List items */
    .list-item {
      padding: 11px 16px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      transition: all 0.12s;
      border-left: 2px solid transparent;
    }
    .list-item:hover { background: var(--surface-hover); }
    .list-item.active {
      background: var(--surface-active);
      border-left-color: var(--accent);
    }
    .list-item .sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 10px;
    }
    .list-item .svc-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      margin-right: 8px;
      vertical-align: middle;
    }
    .list-item .pod-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 8px;
      box-shadow: 0 0 4px var(--green);
    }

    /* Detail panel */
    .detail {
      padding: 24px 28px;
      overflow-y: auto;
    }
    .detail h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
    }

    /* Toolbar */
    .keys-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    .keys-toolbar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .keys-toolbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .keys-toolbar input::placeholder { color: var(--muted); }

    /* Buttons */
    .btn {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .btn:hover { border-color: var(--border-light); background: var(--surface-hover); color: var(--text); }
    .btn.danger { border-color: rgba(244,114,114,0.25); color: var(--red); }
    .btn.danger:hover { background: var(--red-dim); border-color: var(--red); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.97); }

    .btn-sm {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }
    thead { position: sticky; top: 0; }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.1s;
    }
    tbody tr:hover td { background: var(--surface); }
    td .key-text {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }
    td .ttl-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    td .time-text {
      color: var(--muted);
      font-size: 12px;
    }
    td .actions-cell {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge.green { background: var(--green-dim); color: var(--green); }
    .badge.red { background: var(--red-dim); color: var(--red); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 0;
      width: 580px;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
      animation: modalIn 0.2s ease-out;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 14px; font-weight: 600; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.12s;
    }
    .modal-close:hover { background: var(--surface-hover); color: var(--text); }
    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      max-height: calc(80vh - 60px);
    }
    .modal-field { margin-bottom: 16px; }
    .modal-field:last-child { margin-bottom: 0; }
    .key-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .key-name {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      word-break: break-all;
      background: var(--bg);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .modal pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-secondary);
      line-height: 1.6;
      max-height: 320px;
      overflow-y: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      z-index: 200;
      animation: toastIn 0.25s ease-out;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .toast.error { border-color: rgba(244,114,114,0.3); }
    .toast.error::before { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .toast.success { border-color: rgba(52,211,153,0.3); }
    .toast.success::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Empty states */
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 40px 16px;
      text-align: center;
      line-height: 1.6;
    }
    .empty-icon {
      font-size: 28px;
      margin-bottom: 8px;
      opacity: 0.4;
    }
    .loading { color: var(--muted); font-size: 13px; padding: 16px; }

    /* Refresh result panel */
    .refresh-result {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-top: 12px;
      animation: fadeIn 0.25s;
    }
    .refresh-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .refresh-result-header .title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .refresh-result-header .summary {
      font-size: 11px;
      font-weight: 600;
    }
    .refresh-result-header .summary.all-ok { color: var(--green); }
    .refresh-result-header .summary.partial { color: var(--yellow); }
    .refresh-result-header .summary.all-fail { color: var(--red); }
    .pod-ack-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pod-ack {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .pod-ack .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pod-ack.ok .dot { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .pod-ack.fail .dot { background: var(--red); box-shadow: 0 0 4px var(--red); }
    .pod-ack .pod-ack-name {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      flex: 1;
    }
    .pod-ack .pod-ack-status {
      font-size: 10px;
      font-weight: 600;
    }
    .pod-ack.ok .pod-ack-status { color: var(--green); }
    .pod-ack.fail .pod-ack-status { color: var(--red); }
    .pod-ack .pod-ack-error {
      font-size: 10px;
      color: var(--muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Focus ring */
    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>Shudhi <span>Cache Dashboard</span></h1>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="config-bar">
      <label>API</label>
      <input id="sidecarUrl" value="" placeholder="leave empty for same-origin proxy">
      <button onclick="init()">Connect</button>
    </div>
  </header>

  <div class="layout">
    <!-- Services panel -->
    <div class="panel" id="servicesPanel">
      <div class="panel-header">Services <span class="count" id="svcCount">0</span></div>
      <div id="servicesList">
        <div class="empty">
          <div class="empty-icon">&#9781;</div>
          Connecting...
        </div>
      </div>
    </div>

    <!-- Pods panel -->
    <div class="panel" id="podsPanel">
      <div class="panel-header">Pods <span class="count" id="podCount">0</span></div>
      <div id="podsList">
        <div class="empty">
          <div class="empty-icon">&#8862;</div>
          Select a service
        </div>
      </div>
    </div>

    <!-- Detail panel -->
    <div class="panel detail" id="detailPanel">
      <div class="empty">
        <div class="empty-icon">&#9878;</div>
        Select a service to view cached keys
      </div>
    </div>
  </div>

  <!-- Value modal -->
  <div class="modal-overlay" id="valueModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Cached Value</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <div class="key-label">Key</div>
          <div class="key-name" id="modalKeyName"></div>
        </div>
        <div class="modal-field">
          <div class="key-label">Pod</div>
          <div class="key-name" id="modalPodName"></div>
        </div>
        <div class="modal-field">
          <div class="key-label">Value</div>
          <pre id="modalValue"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    let state = {
      baseUrl: '',
      services: [],
      selectedService: null,
      pods: [],
      selectedPod: null,
      keys: [],
      filter: '',
      lastClear: null,
      connected: false,
    };

    function getBaseUrl() {
      const v = document.getElementById('sidecarUrl').value.trim().replace(/\/+$/, '');
      return v;
    }

    async function api(path, opts = {}) {
      const url = state.baseUrl + path;
      try {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        return await res.json();
      } catch (e) {
        toast(e.message, 'error');
        throw e;
      }
    }

    async function init() {
      state.baseUrl = getBaseUrl();
      try {
        const data = await api('/api/services');
        state.services = data.services || [];
        state.selectedService = null;
        state.selectedPod = null;
        state.pods = [];
        state.keys = [];
        state.connected = true;
        document.getElementById('statusDot').classList.add('connected');
        renderServices();
        renderPods();
        renderDetail();
        toast('Connected', 'success');
      } catch (e) {
        state.connected = false;
        document.getElementById('statusDot').classList.remove('connected');
      }
    }

    window.addEventListener('DOMContentLoaded', init);

    async function selectService(svc) {
      state.selectedService = svc;
      state.selectedPod = null;
      state.lastClear = null;
      renderServices();
      try {
        const data = await api(`/api/pods?service=${encodeURIComponent(svc)}`);
        state.pods = data.pods || [];
        renderPods();
        await loadKeys();
      } catch (e) {}
    }

    async function selectPod(podName) {
      state.selectedPod = podName;
      state.lastClear = null;
      renderPods();
      await loadKeys();
    }

    async function loadKeys() {
      if (!state.selectedService) return;
      let url = `/api/keys?service=${encodeURIComponent(state.selectedService)}`;
      if (state.selectedPod) url += `&pod=${encodeURIComponent(state.selectedPod)}`;
      try {
        const data = await api(url);
        state.keys = data.keys || [];
        state.filter = '';
        renderDetail();
      } catch (e) {}
    }

    async function getValue(serviceName, podName, key) {
      try {
        const data = await api('/api/pod/get', {
          method: 'POST',
          body: JSON.stringify({ serviceName, podName, key }),
        });
        document.getElementById('modalKeyName').textContent = key;
        document.getElementById('modalPodName').textContent = podName;
        document.getElementById('modalValue').textContent = data.found
          ? JSON.stringify(data.value, null, 2)
          : '(not found in cache)';
        document.getElementById('valueModal').classList.add('open');
      } catch (e) {}
    }

    async function clearKey(serviceName, keyName) {
      try {
        const data = await api('/api/refresh', {
          method: 'POST',
          body: JSON.stringify({
            serviceName: serviceName,
            keyInfix: keyName,
          }),
        });
        state.lastClear = { keyName, result: data };
        renderKeysTable();
        const ok = data.confirmed || 0;
        const total = data.total || 0;
        toast(`Cleared "${shortKey(keyName)}" — ${ok}/${total} pods confirmed`, ok === total ? 'success' : 'error');
      } catch (e) {}
    }

    async function clearAllKeys() {
      if (!state.selectedService) return;
      try {
        const data = await api('/api/refresh', {
          method: 'POST',
          body: JSON.stringify({
            serviceName: state.selectedService,
            keyInfix: null,
          }),
        });
        state.lastClear = { keyName: null, result: data };
        renderKeysTable();
        const ok = data.confirmed || 0;
        const total = data.total || 0;
        toast(`Cleared all keys — ${ok}/${total} pods confirmed`, ok === total ? 'success' : 'error');
      } catch (e) {}
    }

    function closeModal() {
      document.getElementById('valueModal').classList.remove('open');
    }

    // --- Rendering ---

    function renderServices() {
      const el = document.getElementById('servicesList');
      document.getElementById('svcCount').textContent = state.services.length;
      if (!state.services.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">&#9781;</div>${state.connected ? 'No services found' : 'Connecting...'}</div>`;
        return;
      }
      el.innerHTML = state.services.map(svc =>
        `<div class="list-item ${svc === state.selectedService ? 'active' : ''}"
              onclick="selectService('${esc(svc)}')">
          <span class="svc-icon">${esc(svc.charAt(0).toUpperCase())}</span>${esc(svc)}
        </div>`
      ).join('');
    }

    function renderPods() {
      const el = document.getElementById('podsList');
      document.getElementById('podCount').textContent = state.pods.length;
      if (!state.selectedService) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">&#8862;</div>Select a service</div>';
        return;
      }
      if (!state.pods.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">&#8862;</div>No live pods</div>';
        return;
      }
      let html = `<div class="list-item ${state.selectedPod === null ? 'active' : ''}"
                       onclick="selectPod(null)">All pods</div>`;
      html += state.pods.map(p =>
        `<div class="list-item ${p.podName === state.selectedPod ? 'active' : ''}"
              onclick="selectPod('${esc(p.podName)}')">
          <div><span class="pod-dot"></span>${esc(p.podName)}</div>
          <div class="sub">${esc(p.sidecarUrl)}</div>
        </div>`
      ).join('');
      el.innerHTML = html;
    }

    function renderDetail() {
      const el = document.getElementById('detailPanel');
      if (!state.selectedService) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">&#9878;</div>Select a service to view cached keys</div>';
        return;
      }

      if (!el.querySelector('.keys-toolbar')) {
        el.innerHTML = `
          <h2 id="detailTitle"></h2>
          <div class="keys-toolbar">
            <input id="filterInput" placeholder="Search keys..." value="">
            <button class="btn danger" onclick="clearAllKeys()">Clear All</button>
          </div>
          <div id="keysTableContainer"></div>
          <div id="refreshResultContainer"></div>
          <div id="keysCountLabel" style="margin-top:10px;color:var(--muted);font-size:11px;font-weight:500"></div>
        `;
        document.getElementById('filterInput').addEventListener('input', function() {
          state.filter = this.value;
          renderKeysTable();
        });
      }

      document.getElementById('detailTitle').textContent =
        `Keys — ${state.selectedService} ${state.selectedPod ? '/ ' + state.selectedPod : '(all pods)'}`;

      const filterEl = document.getElementById('filterInput');
      if (filterEl !== document.activeElement) {
        filterEl.value = state.filter;
      }

      renderKeysTable();
    }

    function renderKeysTable() {
      const container = document.getElementById('keysTableContainer');
      const countLabel = document.getElementById('keysCountLabel');
      if (!container) return;

      const filtered = state.keys.filter(k =>
        !state.filter || k.keyName.toLowerCase().includes(state.filter.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty"><div class="empty-icon">&#9898;</div>No keys found</div>';
      } else {
        container.innerHTML = `<table>
          <thead><tr>
            <th>Key</th>
            <th>Pod</th>
            <th>TTL</th>
            <th>Registered</th>
            <th style="text-align:right">Actions</th>
          </tr></thead>
          <tbody>${filtered.map(k => `
            <tr onclick="getValue('${esc(state.selectedService)}', '${esc(k.podName)}', '${esc(k.keyName)}')">
              <td><span class="key-text" title="${esc(k.keyName)}">${esc(k.keyName)}</span></td>
              <td>${esc(shortPod(k.podName))}</td>
              <td>${k.ttlInSeconds ? `<span class="ttl-badge">${k.ttlInSeconds}s</span>` : '<span class="time-text">—</span>'}</td>
              <td><span class="time-text">${k.registeredAt ? timeAgo(k.registeredAt) : '—'}</span></td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-sm" onclick="event.stopPropagation(); getValue('${esc(state.selectedService)}', '${esc(k.podName)}', '${esc(k.keyName)}')">Get</button>
                  <button class="btn btn-sm danger" onclick="event.stopPropagation(); clearKey('${esc(state.selectedService)}', '${esc(k.keyName)}')">Clear</button>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      }

      renderRefreshResult();

      countLabel.textContent = `${filtered.length} key${filtered.length !== 1 ? 's' : ''}`;
    }

    function renderRefreshResult() {
      const container = document.getElementById('refreshResultContainer');
      if (!container) return;

      if (!state.lastClear || !state.lastClear.result) {
        container.innerHTML = '';
        return;
      }

      const r = state.lastClear.result;
      const pods = r.pods || [];
      const confirmed = r.confirmed || 0;
      const total = r.total || 0;
      const keyLabel = state.lastClear.keyName
        ? `Key: ${esc(shortKey(state.lastClear.keyName))}`
        : 'All keys';

      let summaryClass = 'all-ok';
      let summaryText = `${confirmed}/${total} pods confirmed`;
      if (confirmed === 0 && total > 0) {
        summaryClass = 'all-fail';
      } else if (confirmed < total) {
        summaryClass = 'partial';
      }

      container.innerHTML = `
        <div class="refresh-result">
          <div class="refresh-result-header">
            <span class="title">${keyLabel}</span>
            <span class="summary ${summaryClass}">${summaryText}</span>
          </div>
          <div class="pod-ack-list">
            ${pods.map(p => `
              <div class="pod-ack ${p.success ? 'ok' : 'fail'}">
                <span class="dot"></span>
                <span class="pod-ack-name">${esc(p.podName)}</span>
                <span class="pod-ack-status">${p.success ? 'cleared' : 'failed'}</span>
                ${p.error ? `<span class="pod-ack-error" title="${esc(p.error)}">${esc(p.error)}</span>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- Helpers ---

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function shortPod(name) {
      if (!name) return '';
      const parts = name.split('-');
      return parts.length > 2 ? '...' + parts.slice(-2).join('-') : name;
    }

    function shortKey(name) {
      if (!name) return '';
      return name.length > 30 ? name.slice(0, 27) + '...' : name;
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      return Math.floor(hrs / 24) + 'd ago';
    }

    function toast(msg, type = '') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    document.getElementById('valueModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
